
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Jardim de Flores</title>
</head>
<body>

    <div class="container">

        <div class="decoracao">✿ ❀ ✿</div>

        <h1>jardim de flores</h1>

        <p class="subtitulo">
            Um cantinho especial para suas flores favoritas 
        </p>

        <form id="formAluno">

            <label for="nome">Nome da flor</label>
            <input type="text" id="nome" placeholder="Ex: Rosa" required>

            <label for="curso">Tipo da flor</label>
            <input type="text" id="curso" placeholder="Ex: Flor ornamental" required>

            <button id="btnSalvar" type="submit">
                ✿ Adicionar flor
            </button>

        </form>

        <table>

            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Nome da flor</th>
                    <th>Tipo</th>
                </tr>
            </thead>

            <tbody id="corpoTabela"></tbody>

        </table>

        <div class="final-decorativo">✿   ✿</div>

        <footer>
            GEOVANNA GASPARINO PEREIRA
        </footer>

    </div>

    <script src="main.js"></script>

</body>
</html>
